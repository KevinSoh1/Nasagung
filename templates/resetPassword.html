<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나사궁 - 비밀번호 재설정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a1128;
            --accent-gold: #cfb53b;
            --white: #ffffff;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-dark); color: var(--white); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-card { max-width: 420px; width: 100%; padding: 2.5rem 2rem; border-radius: 15px; background: #fff; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .reset-card h3 { font-weight: 700; color: #0a1128; text-align: center; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<div class="card reset-card">
    <h3>비밀번호 재설정</h3>
    
    <form id="resetPasswordForm">
        <!-- URL Query Parameter에서 전달받은 토큰 값 (Jinja2 등 템플릿 엔진 사용 시) -->
        <input type="hidden" id="resetToken" name="token" value="{{ token }}">

        <div class="mb-3">
            <label class="form-label fw-bold small">새 비밀번호</label>
            <input type="password" id="newPassword" name="new_password" class="form-control" placeholder="8자 이상 입력" required minlength="8">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold small">새 비밀번호 확인</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="비밀번호 재입력" required>
            <div id="pwMismatch" class="text-danger small mt-1 d-none">비밀번호가 일치하지 않습니다.</div>
        </div>

        <div id="responseMsg" class="alert d-none py-2 px-3 my-2 small"></div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-bold py-2 mt-2">비밀번호 변경하기</button>
    </form>
</div>

<script>
    const form = document.getElementById("resetPasswordForm");
    const newPw = document.getElementById("newPassword");
    const confirmPw = document.getElementById("confirmPassword");
    const mismatchText = document.getElementById("pwMismatch");
    const msgBox = document.getElementById("responseMsg");

    // URL에서 토큰을 추출하는 헬퍼 함수 (템플릿 변수가 없을 경우 대비)
    const getQueryParam = (param) => new URLSearchParams(window.location.search).get(param);

    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        
        // 비밀번호 일치 검증
        if (newPw.value !== confirmPw.value) {
            mismatchText.classList.remove("d-none");
            return;
        } else {
            mismatchText.classList.add("d-none");
        }

        const token = document.getElementById("resetToken").value || getQueryParam("token");

        try {
            const response = await fetch("/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    token: token,
                    new_password: newPw.value
                })
            });
            const data = await response.json();

            msgBox.classList.remove("d-none", "alert-success", "alert-danger");
            if (data.success) {
                msgBox.classList.add("alert-success");
                msgBox.innerText = data.message;
                setTimeout(() => { window.location.href = "/login"; }, 2000);
            } else {
                msgBox.classList.add("alert-danger");
                msgBox.innerText = data.message || "비밀번호 재설정에 실패했습니다.";
            }
        } catch (err) {
            msgBox.classList.remove("d-none", "alert-success");
            msgBox.classList.add("alert-danger");
            msgBox.innerText = "서버 통신 중 오류가 발생했습니다.";
        }
    });
</script>
</body>
</html>
