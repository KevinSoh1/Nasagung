<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나사궁 - 로또 조합 결제</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a1128; color: #fff; font-family: 'Pretendard', sans-serif; padding: 25px; text-align: center; }
        .pay-box { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; border: 1px solid rgba(207,181,59,0.3); margin-top: 15px; }
        .gold-txt { color: #cfb53b; font-weight: 700; }
        .btn-pay { background: #cfb53b; color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 6px; margin-top: 15px; cursor: pointer; transition: 0.3s; }
        .btn-pay:hover { background: #b89e2b; }
    </style>
</head>
<body>

    <h4 class="fw-bold gold-txt mb-3">AI 행운의 번호 전체 열람</h4>
    <p class="small text-white-50">천기의 기운을 담아 생성된 나머지 로또 조합(총 5게임)을 모두 잠금 해제합니다.</p>

    {% if pay_success %}
        <div class="pay-box mt-4">
            <h5 class="fw-bold text-success mb-3">결제가 완료되었습니다!</h5>
            <p class="small">잠시 후 창이 닫히며 전체 번호 조합이 열람됩니다.</p>
        </div>
        <script>
            // 결제 성공 시 부모 창에 성공 메시지를 전달하고 팝업창을 닫습니다.
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ status: "PAYMENT_COMPLETE" }, "*");
            }
            setTimeout(function() {
                window.close();
            }, 600);
        </script>
    {% else %}
        <div class="pay-box">
            <div class="d-flex justify-content-between mb-2">
                <span>결제 필요 포인트 :</span>
                <span class="fw-bold">{{ price }} P</span>
            </div>
            <div class="d-flex justify-content-between border-top pt-2">
                <span>나의 보유 포인트 :</span>
                <span class="fw-bold gold-txt">{{ user_point }} P</span>
            </div>
        </div>

        {% if msg %}
            <div class="alert alert-danger mt-3 mb-0 py-2 small">{{ msg }}</div>
        {% endif %}

        <form method="POST" action="/pay_popup">
            <input type="hidden" name="action_pay" value="1">
            {% if user_point >= price %}
                <button type="submit" class="btn-pay">500 포인트 차감 및 결제하기</button>
            {% else %}
                <button type="button" class="btn-pay bg-danger text-white" onclick="alert('포인트가 부족합니다. 먼저 포인트를 충전해 주세요.');">포인트 부족 (충전 필요)</button>
            {% endif %}
            <button type="button" class="btn btn-sm btn-outline-secondary w-100 mt-2 text-white" onclick="window.close();">취소</button>
        </form>
    {% endif %}

</body>
</html>
