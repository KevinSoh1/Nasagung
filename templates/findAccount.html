<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나사궁 - 계정 정보 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        a { text-decoration: none; color: black; }
        a:visited { color: black; }
        a:hover { color: gray; }
        a:active { color: black; }

        :root {
            --bg-dark: #0a1128;
            --accent-gold: #cfb53b;
            --white: #ffffff;
            --text-muted: #bdc3c7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-dark); color: var(--white); overflow-x: hidden; }
        
        header {
            background: rgba(10, 17, 40, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .header-container {
            max-width: 1200px; margin: 0 auto; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Noto Serif KR', serif; font-size: 1.5rem; font-weight: 700; color: var(--white); }
        .logo span { color: var(--accent-gold); font-size: 1.2rem; margin-left: 5px; }

        nav .main-menu { display: flex; list-style: none; }
        nav .main-menu li { margin: 0 15px; position: relative; }
        nav .main-menu li a { color: var(--white); text-decoration: none; font-size: 0.95rem; transition: 0.3s; }
        nav .main-menu li a:hover { color: var(--accent-gold); }

        .submenu {
            display: none; position: absolute; top: 100%; left: 0; background: #151e3d;
            min-width: 150px; border-radius: 5px; padding: 10px 0; list-style: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .submenu li a { padding: 8px 20px; display: block; font-size: 0.85rem; color: var(--white) !important; }
        .dropdown:hover .submenu { display: block; }

        .auth-buttons { display: flex; }
        .btn-login { background: transparent; border: 1px solid var(--white); color: var(--white); padding: 8px 18px; border-radius: 5px; margin-right: 10px; cursor: pointer; }
        .btn-signup { background: var(--accent-gold); border: none; color: #000; padding: 8px 18px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        

        .find-card {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #fff;
            color: #333 !important;
        }

        .find-card h3 { color: #333 !important; font-weight: 600; }
        .find-card label { color: #555; margin-bottom: 5px; margin-top: 10px; font-weight: bold; }
        .find-card label:first-of-type { margin-top: 0; }

        .nav-pills .nav-link {
            color: #555;
            font-weight: bold;
            border-radius: 8px;
            background-color: #f1f3f5;
        }
        .nav-pills .nav-link.active {
            background-color: var(--bg-dark);
            color: #fff;
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(10, 17, 40, 0.5), rgba(10, 17, 40, 0.5)), 
                        url('/static/images/background.png') center/cover no-repeat;
            background-attachment: fixed;
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding-top: 140px; 
            padding-bottom: 60px;
        }

        .hero-content { position: relative; z-index: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 40px 20px; }
        .intro-text { text-align: center; margin-bottom: 30px; }
        .intro-text h1 { font-family: 'Noto Serif KR', serif; font-size: 2.5rem; line-height: 1.3; margin-bottom: 15px; }
        .intro-text .highlight { color: var(--accent-gold); }
        .intro-text p { color: var(--text-muted); font-size: 1.1rem; }
    </style>
</head>
<body>

{% include 'TopMenu.html' %}

<main class="hero">
    <div class="hero-content">
        <section class="intro-text">
            <h1>계정 정보를 <span class="highlight">잊으셨나요?</span></h1>
            <p>가입 시 등록하신 정보로 계정을 찾을 수 있습니다</p>
        </section>
        
        <div class="card find-card mt-3">
            <!-- 💡 아이디 찾기 / 비밀번호 재설정 탭 -->
            <ul class="nav nav-pills nav-justified mb-4" id="findTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="id-tab" data-bs-toggle="pill" data-bs-target="#find-id" type="button" role="tab">아이디 찾기</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pw-tab" data-bs-toggle="pill" data-bs-target="#reset-pw" type="button" role="tab">비밀번호 재설정</button>
                </li>
            </ul>

            <div class="tab-content" id="findTabContent">
                <!-- 1. 아이디(이메일) 찾기 폼 -->
                <div class="tab-pane fade show active" id="find-id" role="tabpanel">
                    <form action="/find-id" method="POST">
                        <label class="form-label small">이름</label>
                        <input type="text" name="name" class="form-control mb-2" placeholder="홍길동" required>
                        
                        <label class="form-label small">생년월일 (8자리)</label>
                        <input type="text" name="birthdate" class="form-control mb-3" placeholder="19900101" maxlength="8" required>
                        
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">아이디 찾기</button>
                    </form>
                </div>

                <!-- 2. 비밀번호 재설정 폼 -->
                <div class="tab-pane fade" id="reset-pw" role="tabpanel">
                    <form action="/reset-password-request" method="POST">
                        <label class="form-label small">이메일 (아이디)</label>
                        <input type="email" name="email" class="form-control mb-2" placeholder="example@mail.com" required>
                        
                        <label class="form-label small">이름</label>
                        <input type="text" name="name" class="form-control mb-3" placeholder="홍길동" required>
                        
                        <p class="text-muted small mb-3">입력하신 이메일로 비밀번호 재설정 링크가 발송됩니다.</p>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">재설정 링크 발송</button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4 small">
                생각나셨나요? <a href="/login" class="text-decoration-none text-primary fw-bold ms-1">로그인 하러가기</a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
