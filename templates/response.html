<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나사궁 - 당신의 운명은 이미 흐르고 있습니다</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    	a {
            text-decoration: none;   /* 밑줄 제거 */
    	    color: black;            /* 기본 색상 지정 */
  	}

  	a:visited {
    	    color: black;            /* 방문 후에도 같은 색상 유지 */
  	}

  	a:hover {
    	    color: gray;             /* 마우스 올렸을 때 색상 (선택사항) */
  	}

  	a:active {
    	    color: black;            /* 클릭 시에도 같은 색상 유지 */
  	}
        :root {
            --bg-dark: #0a1128;
            --accent-gold: #cfb53b;
            --white: #ffffff;
            --text-muted: #bdc3c7;
            --glass-bg: rgba(255, 255, 255, 0.92);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-dark); color: var(--white); overflow-x: hidden; }

        header {
            background: rgba(10, 17, 40, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .header-container {
            max-width: 1200px; margin: 0 auto; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Noto Serif KR', serif; font-size: 1.5rem; font-weight: 700; color: var(--white); }
        .logo span { color: var(--accent-gold); font-size: 1.2rem; margin-left: 5px; }

        nav .main-menu { display: flex; list-style: none; }
        nav .main-menu li { margin: 0 15px; position: relative; }
        nav .main-menu li a { color: var(--white); text-decoration: none; font-size: 0.95rem; transition: 0.3s; }
        nav .main-menu li a:hover { color: var(--accent-gold); }

        .submenu {
            display: none; position: absolute; top: 100%; left: 0; background: #151e3d;
            min-width: 150px; border-radius: 5px; padding: 10px 0; list-style: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .submenu li a { padding: 8px 20px; display: block; font-size: 0.85rem; color: var(--white) !important; }
        .dropdown:hover .submenu { display: block; }

        .auth-buttons { display: flex; }
        .btn-login { background: transparent; border: 1px solid var(--white); color: var(--white); padding: 8px 18px; border-radius: 5px; margin-right: 10px; cursor: pointer; }
        .btn-signup { background: var(--accent-gold); border: none; color: #000; padding: 8px 18px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* register.php / login.php와 완벽하게 동일한 규격으로 매칭 */
        .hero {
            min-height: 100vh; /* height에서 min-height로 변경하여 유연성 확보 */
            background: linear-gradient(rgba(10, 17, 40, 0.5), rgba(10, 17, 40, 0.5)), 
						url('/static/images/background.png') center/cover no-repeat;
            background-attachment: fixed; /* 배경 이미지 왜곡 방지 붙박이 고정 */
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding-top: 140px; 
            padding-bottom: 60px;
        }

        .hero-content { position: relative; z-index: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 40px 20px; }

        /* 다른 파일들과 폰트 및 구조 크기 동기화 */
        .intro-text { text-align: center; margin-bottom: 40px; }
        .intro-text h1 { font-family: 'Noto Serif KR', serif; font-size: 3.2rem; line-height: 1.3; margin-bottom: 15px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .intro-text .highlight { color: var(--accent-gold); }
        .intro-text p { color: var(--text-muted); font-size: 1.2rem; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); }

        /* 하단 메인 콘텐츠 정렬 구조 (기존 레이아웃 보존) */
        .main-content-layout { display: flex; gap: 40px; align-items: flex-start; }

        .saju-section { flex: 1.2; background: var(--glass-bg); padding: 40px; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); color: #333; }
        .saju-section h2 { font-family: 'Noto Serif KR', serif; font-size: 1.8rem; margin-bottom: 30px; color: var(--bg-dark); font-weight: 700; text-align: center; }
        

        @media (max-width: 992px) {
            .main-content-layout { flex-direction: column; }
            .hero { height: auto; padding: 120px 0 60px; }
            .intro-text h1 { font-size: 2.2rem; }
        }
        
        .title{
            font-size:32px;
            font-weight:bold;
            margin-bottom:30px;
        }

        .result-box{
            background:#1d1d1d;
            padding:30px;
            border-radius:20px;
            white-space:pre-wrap;
        }
    </style>
</head>
<body>
<!-- 💡 JS로 TopMenu.html을 불러와서 div 안에 삽입 
    <script>
        fetch('TopMenu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('top-menu').innerHTML = data;
            });
    </script>
	-->
<!-- 메인 메뉴가 들어갈 위치 시작
<div id="top-menu"></div>
      메인 메뉴가 들어갈 위치 끝 -->	
{% include 'TopMenu.html' %}

<main class="hero">
    <div class="hero-content">
        <section class="intro-text">
            <h1>당신의 운명은 이미 <span class="highlight">흐르고</span> 있습니다</h1>
            <p>사주팔자로 미래의 방향을 확인해보세요</p>
        </section>

        <div class="main-content-layout mt-5">
            <aside class="quick-menu">
             <div id="username"></div>
             <br>
             <div class="result-box" id="result">
            	분석중...
             </div>   
            </aside>
        </div>
    </div>
</main>

<script>
    const result = localStorage.getItem("sajuResult") || "분석 결과를 불러올 수 없습니다.";
    const userName = localStorage.getItem("userName") || "고객";
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";

    // 이름 세팅
    document.getElementById("username").innerHTML = "<h2>" + userName + "님의 명반 분석</h2>";

    // 결과 텍스트 변환
    const resultBox = document.getElementById("result");
    let formattedResult = result.replace(/\n/g, "<br>");

    // 비로그인 사용자 안내 레이아웃 추가
    if (!isLoggedIn) {
        formattedResult += "...<br><br>";
       formattedResult += `
       <div style="margin-top: 25px; padding: 20px; background: rgba(207, 181, 59, 0.12); border: 1px solid var(--accent-gold); border-radius: 12px; text-align: center;">
                <p style="color: #fff; font-size: 1rem; margin-bottom: 12px; font-weight: 600;">
                    전체 명반 분석 결과는 로그인 후 확인하실 수 있습니다.
                </p>
                <a href="/login" style="display: inline-block; padding: 10px 24px; background: var(--accent-gold); color: #000; font-weight: bold; border-radius: 6px; text-decoration: none;">
                    로그인하러 가기 ➔
                </a>
            </div>
        `;
    }

    resultBox.innerHTML = formattedResult;
</script>

</body>
</html>
