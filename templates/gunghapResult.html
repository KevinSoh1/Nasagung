<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나사궁 - 궁합 분석 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a1128;
            --accent-gold: #cfb53b;
            --white: #ffffff;
            --text-muted: #bdc3c7;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-dark); color: var(--white); overflow-x: hidden; }

        a { text-decoration: none; color: white; }
        a:hover { color: var(--accent-gold); }

        /* 상단 메뉴 */
        header {
            background: rgba(10, 17, 40, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .header-container {
            max-width: 1200px; margin: 0 auto; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; white-space: nowrap; width: 100%;
        }
        .logo { font-family: 'Noto Serif KR', serif; font-size: 1.5rem; font-weight: 700; color: var(--white); }
        .logo span { color: var(--accent-gold); font-size: 1.2rem; margin-left: 5px; }

        nav .main-menu { display: flex; list-style: none; margin: 0; padding: 0; }
        nav .main-menu li { margin: 0 15px; position: relative; }
        nav .main-menu li a { color: var(--white); text-decoration: none; font-size: 0.95rem; transition: 0.3s; }
        nav .main-menu li a:hover { color: var(--accent-gold); }

        /* 배경 및 히어로 섹션 */
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(10, 17, 40, 0.6), rgba(10, 17, 40, 0.6)), 
                        url('../images/background.png') center/cover no-repeat;
            background-attachment: fixed;
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 130px; padding-bottom: 80px;
        }

        .hero-content { max-width: 900px; width: 100%; margin: 0 auto; padding: 20px; }

        /* 결과 상자 디자인 */
        .result-container {
            background: var(--glass-bg);
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            color: #222;
        }

        .couple-header {
            text-align: center;
            border-bottom: 2px solid rgba(207, 181, 59, 0.4);
            padding-bottom: 25px;
            margin-bottom: 30px;
        }
        .couple-names {
            font-family: 'Noto Serif KR', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--bg-dark);
        }
        .couple-names .heart { color: #e74c3c; margin: 0 10px; display: inline-block; }

        .result-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
            word-break: keep-all;
            white-space: pre-line;
        }

        .btn-retry {
            display: block; width: 100%; max-width: 300px; margin: 30px auto 0 auto;
            background: var(--bg-dark); color: #fff; text-align: center;
            padding: 14px; border-radius: 8px; font-weight: bold; transition: 0.3s;
        }
        .btn-retry:hover { background: var(--accent-gold); color: #000; }
    </style>
</head>
<body>
<!-- 💡 JS로 TopMenu.html을 불러와서 div 안에 삽입 
<script>
	fetch('TopMenu.html')
        	.then(response => response.text())
            	.then(data => {
                document.getElementById('top-menu').innerHTML = data;
            });
</script>
-->
<!-- 메인 메뉴가 들어갈 위치 시작
<div id="top-menu"></div>
      메인 메뉴가 들어갈 위치 끝 -->	
{% include 'TopMenu.html' %}

<main class="hero">
    <div class="hero-content">
        <div class="result-container">
            <div class="couple-header">
                <div class="couple-names" id="coupleTitle">
                    <span id="meNameText">사용자</span>
                    <span class="heart">?</span>
                    <span id="partnerNameText">상대방</span>
                </div>
                <p style="color: #666; font-size: 0.95rem; margin-top: 8px;">두 분의 명식 조화 분석 리포트</p>
            </div>

            <!-- AI 궁합 분석 결과 출력 영역 -->
            <div id="resultContent" class="result-body">
                분석 결과를 불러오는 중입니다...
            </div>

            <a href="/gunghap.html" class="btn-retry">다시 궁합 보기 ?</a>
        </div>
    </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const meName = localStorage.getItem("meName") || "나";
    const partnerName = localStorage.getItem("partnerName") || "상대방";
    const result = localStorage.getItem("gunghapResult") || "결과를 불러올 수 없습니다.";
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";

    document.getElementById("meNameText").innerText = meName;
    document.getElementById("partnerNameText").innerText = partnerName;

    const resultBox = document.getElementById("resultContent");
    let htmlContent = result.replace(/\n/g, "<br>");

    // 비로그인 사용자용 가로 확장 및 세로 축소형 로그인 배너 추가
    if (!isLoggedIn) {
        htmlContent += "<br><br><span style='color: #888;'>(... 이하 생략)</span>";
        htmlContent += `
            <div style="
                max-width: 600px;
                margin: 20px auto 0 auto;
                padding: 10px 18px;
                background: rgba(10, 17, 40, 0.9);
                border: 1px solid var(--accent-gold);
                border-radius: 8px;
                text-align: center;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                flex-wrap: wrap;
            ">
                <p style="
                    color: #ffffff;
                    font-size: 0.9rem;
                    margin: 0;
                    font-weight: 500;
                    line-height: 1.3;
                    flex: 1;
                    min-width: 200px;
                    text-align: left;
                ">
                    전체 궁합 상세 리포트는 로그인 후 확인하실 수 있습니다.
                </p>
                <a href="/login.html" style="
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 4px;
                    padding: 6px 14px;
                    background: #cfb53b;
                    color: #000000;
                    font-size: 0.85rem;
                    font-weight: 700;
                    border-radius: 5px;
                    text-decoration: none;
                    white-space: nowrap;
                ">
                    <span>로그인하러 가기</span>
                    <span style="font-family: sans-serif;">?</span>
                </a>
            </div>
        `;
    }

    resultBox.innerHTML = htmlContent;
});
</script>
</body>
</html>
